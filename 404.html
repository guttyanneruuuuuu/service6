<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ff1f6d" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#14101e" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <title>ピンが見つかりません — Pinly</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Noto+Sans+JP:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./page.css">
  <style>
    body { display: flex; min-height: 100vh; align-items: center; justify-content: center; }
    .nf { text-align: center; padding: 32px 24px; max-width: 520px; }
    .nf__pin {
      width: 120px; height: 148px; margin: 0 auto 20px;
      background: var(--gradient-brand);
      -webkit-mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 80'><path d='M32 2C15.4 2 2 15.4 2 32c0 22 30 46 30 46s30-24 30-46C62 15.4 48.6 2 32 2zM32 22a10 10 0 1 0 .001 0' fill='white'/></svg>") center/contain no-repeat;
              mask: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 80'><path d='M32 2C15.4 2 2 15.4 2 32c0 22 30 46 30 46s30-24 30-46C62 15.4 48.6 2 32 2zM32 22a10 10 0 1 0 .001 0' fill='white'/></svg>") center/contain no-repeat;
      filter: drop-shadow(0 16px 28px rgba(255, 31, 109, 0.45));
      animation: nfBounce 2.4s infinite var(--ease-spring);
    }
    @keyframes nfBounce {
      0%, 100% { transform: translateY(0) rotate(-2deg); }
      50% { transform: translateY(-12px) rotate(2deg); }
    }
    .nf h1 {
      font-size: 80px; font-weight: 900; margin: 0 0 6px;
      letter-spacing: -.04em;
      background: var(--gradient-brand);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .nf p { color: var(--text-dim); font-size: 16px; margin: 6px auto 24px; }
    .nf .btn { margin-top: 4px; }
  </style>
</head>
<body>
  <main class="nf">
    <div class="nf__pin" aria-hidden="true"></div>
    <h1>404</h1>
    <p>このピンはどこにも刺さっていないようです…<br>探していたページが見つかりませんでした。</p>
    <a class="btn" href="./">地図に戻る →</a>
  </main>
</body>
</html>
