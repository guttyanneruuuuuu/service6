<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
  <title>Pinly — 街の"今"が刺さる地図</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
  <link rel="stylesheet" href="./src/styles/main.css" />
</head>
<body>

  <!-- Boot -->
  <div id="boot" class="boot">
    <div class="boot__logo"></div>
  </div>

  <!-- Map -->
  <div id="map" class="map"></div>

  <!-- App Bar -->
  <div class="appbar">
    <div class="appbar__brand">
      <div class="appbar__logo"></div>
      <span>Pinly</span>
    </div>
    <div class="appbar__search">
      <input type="text" id="searchInput" placeholder="街の声を検索...">
    </div>
    <div class="appbar__actions">
      <button id="locateBtn" class="iconbtn" title="現在地">📍</button>
      <button id="newPinBtn" class="iconbtn" title="ピンを刺す">＋</button>
    </div>
  </div>

  <!-- Category Bar -->
  <div id="catbar" class="catbar"></div>

  <!-- Targeting Crosshair -->
  <div id="targetCross" class="targetcross" hidden>
    <div class="targetcross__ring"></div>
    <div class="targetcross__dot"></div>
  </div>

  <!-- FAB -->
  <button id="fab" class="fab" title="ピンを刺す">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
  </button>

  <!-- Strip -->
  <div class="strip">
    <div class="strip__pulse"></div>
    <span><b><span id="stripCount">0</span></b> ピンが刺されています</span>
  </div>

  <!-- Compose Sheet -->
  <div id="composeSheet" class="sheet" hidden>
    <div class="sheet__overlay" data-close-compose></div>
    <div class="sheet__panel">
      <h2 style="margin-bottom:15px; font-size:20px; font-weight:800;">ピンを刺す</h2>
      <textarea id="composeText" placeholder="今、ここで何が起きてる？ (50文字以内)" maxlength="50"></textarea>
      <div style="display:flex; justify-content:space-between; align-items:center; margin-top:15px;">
        <span id="composeCount" style="font-size:12px; opacity:0.6;">0 / 50</span>
        <button id="composeSend" class="btn btn--primary">投稿する</button>
      </div>
    </div>
  </div>

  <!-- Detail Modal -->
  <div id="detail" class="detail" hidden>
    <div class="detail__overlay" data-close-detail></div>
    <div class="detail__panel">
      <div id="detailAuthor" style="font-size:12px; opacity:0.6; margin-bottom:10px;"></div>
      <p id="detailText" style="font-size:18px; font-weight:700; line-height:1.5;"></p>
      <button class="btn btn--primary" style="width:100%; margin-top:20px;" data-close-detail>閉じる</button>
    </div>
  </div>

  <!-- Intro -->
  <div id="intro" class="intro">
    <div class="intro__overlay"></div>
    <div class="intro__panel">
      <h2 style="font-size:28px; font-weight:900; margin-bottom:15px;">Pinlyへようこそ</h2>
      <p style="margin-bottom:25px; opacity:0.8;">街の"今"を匿名で共有。気になる場所をタップして、一言刺してみよう。</p>
      <button id="introGo" class="btn btn--primary" style="width:100%;">はじめる</button>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast" hidden></div>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
