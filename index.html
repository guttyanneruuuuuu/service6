<body>

  <!-- Boot screen -->
  <div id="boot" class="boot" role="status" aria-live="polite" aria-label="読み込み中">
    <div class="boot__logo" aria-hidden="true"></div>
    <div class="boot__text">街の声を集めています…</div>
  </div>

  <!-- Map canvas -->
  <div id="map" class="map" role="application" aria-label="ピン地図"></div>

  <!-- App Bar -->
  <header class="appbar">
    <button class="appbar__brand" id="brandBtn" title="Pinly について" aria-label="Pinly について">
      <span class="appbar__logo" aria-hidden="true"></span>
      <span class="appbar__name">Pinly <span style="font-size:0.5em;opacity:0.7;margin-left:4px">Beta</span></span>
    </button>
    <div class="appbar__search" role="search">
      <span class="appbar__search-icon" aria-hidden="true">🔎</span>
      <input type="text" id="searchInput" placeholder="ピンを検索…" aria-label="ピンを検索" autocomplete="off" maxlength="80" inputmode="search">
      <button id="searchClear" class="appbar__search-clear" hidden aria-label="検索をクリア">×</button>
    </div>
    <div class="appbar__actions">
      <button id="themeBtn" class="iconbtn" title="テーマ切替" aria-label="ライト/ダークテーマ切替">🌗</button>
      <button id="locateBtn" class="iconbtn" title="現在地" aria-label="現在地に移動">📍</button>
      <button id="menuBtn" class="iconbtn" title="メニュー" aria-label="メニューを開く" aria-haspopup="dialog">≡</button>
    </div>
  </header>

  <!-- Category Bar -->
  <nav id="catbar" class="catbar" aria-label="カテゴリーフィルター"></nav>

  <!-- Targeting Crosshair -->
  <div id="targetCross" class="targetcross" hidden aria-hidden="true">
    <div class="targetcross__ring"></div>
    <div class="targetcross__dot"></div>
    <div class="targetcross__hint">この地点でOK？ 下の決定ボタンを押してね</div>
  </div>

  <!-- FAB -->
  <button id="fab" class="fab" title="ピンを刺す" aria-label="ピンを刺す">
    <svg class="fab__add" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
    <svg class="fab__check" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"></polyline></svg>
  </button>

  <!-- Trend Panel -->
  <aside id="trendPanel" class="side-panel side-panel--left" aria-label="トレンドピン" aria-hidden="true">
    <div class="side-panel__header">
      <span class="side-panel__title">🔥 今、話題のピン</span>
      <button class="side-panel__close" data-close-panel="trend" aria-label="パネルを閉じる">×</button>
    </div>
    <div id="trendList" class="side-panel__list"></div>
  </aside>

  <!-- Ranking Panel -->
  <aside id="rankingPanel" class="side-panel side-panel--left" aria-label="ユーザーランキング" aria-hidden="true">
    <div class="side-panel__header">
      <span class="side-panel__title">🏆 ユーザーランキング</span>
      <button class="side-panel__close" data-close-panel="ranking" aria-label="パネルを閉じる">×</button>
    </div>
    <div id="rankingList" class="side-panel__list"></div>
  </aside>

  <!-- Footer Toggles -->
  <div class="footbar">
    <button id="trendToggle" class="footbar__btn" aria-expanded="false" aria-controls="trendPanel">🔥 トレンド</button>
    <button id="rankingToggle" class="footbar__btn" aria-expanded="false" aria-controls="rankingPanel">🏆 ランキング</button>
  </div>

  <!-- Compose Modal -->
  <div id="compose" class="modal" hidden role="dialog" aria-labelledby="composeTitle" aria-modal="true">
    <div class="modal__backdrop" data-close-compose></div>
    <div class="modal__content">
      <div class="modal__header">
        <h2 id="composeTitle" class="modal__title">ピンを刺す</h2>
        <button class="modal__close" data-close-compose aria-label="閉じる">×</button>
      </div>
      <div class="modal__body">
        <div id="composeCatSelector" class="catbar catbar--modal" role="radiogroup" aria-label="カテゴリー選択"></div>
        <textarea id="composeText" class="modal__textarea" placeholder="いま、ここで何が起きてる？ (50文字以内)" aria-label="投稿内容" maxlength="50"></textarea>
        <div class="modal__footer">
          <span id="composeCount" class="modal__count">0 / 50</span>
          <button id="composeSend" class="btn btn--primary">投稿する ✨</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Detail Modal -->
  <div id="detail" class="modal" hidden role="dialog" aria-labelledby="detailTitle" aria-modal="true">
    <div class="modal__backdrop" data-close-detail></div>
    <div class="modal__content">
      <div class="modal__header">
        <div class="modal__meta">
          <span id="detailCat" class="modal__badge"></span>
          <span id="detailTime" class="modal__time"></span>
        </div>
        <button class="modal__close" data-close-detail aria-label="閉じる">×</button>
      </div>
      <div class="modal__body">
        <div id="detailText" class="modal__main-text"></div>
        <div id="detailLoc" class="modal__loc"></div>
        <div id="detailReactions" class="modal__reactions"></div>
        <div class="modal__actions">
          <button id="reportPin" class="btn btn--text" title="不適切な投稿を報告">🚩 報告</button>
          <button id="deleteOwnPin" class="btn btn--text btn--danger" hidden>🗑️ 削除</button>
        </div>
      </div>
    </div>
  </div>
