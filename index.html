<body>

  <!-- Boot screen -->
  <div id="boot" class="boot" role="status" aria-live="polite" aria-label="読み込み中">
    <div class="boot__logo" aria-hidden="true"></div>
    <div class="boot__text">街の声を集めています…</div>
  </div>

  <!-- Map canvas -->
  <div id="map" class="map" role="application" aria-label="ピン地図"></div>

  <!-- App Bar -->
  <header class="appbar">
    <button class="appbar__brand" id="brandBtn" title="Pinly について" aria-label="Pinly について">
      <span class="appbar__logo" aria-hidden="true"></span>
      <span class="appbar__name">Pinly <span style="font-size:0.5em;opacity:0.7;margin-left:4px">Beta</span></span>
    </button>
    <div class="appbar__search" role="search">
      <span class="appbar__search-icon" aria-hidden="true">🔎</span>
      <input type="text" id="searchInput" placeholder="ピンを検索…" aria-label="ピンを検索" autocomplete="off" maxlength="80" inputmode="search">
      <button id="searchClear" class="appbar__search-clear" hidden aria-label="検索をクリア">×</button>
    </div>
    <div class="appbar__actions">
      <button id="themeBtn" class="iconbtn" title="テーマ切替" aria-label="ライト/ダークテーマ切替">🌗</button>
      <button id="locateBtn" class="iconbtn" title="現在地" aria-label="現在地に移動">📍</button>
      <button id="menuBtn" class="iconbtn" title="メニュー" aria-label="メニューを開く" aria-haspopup="dialog">≡</button>
    </div>
  </header>

  <!-- Category Bar -->
  <nav id="catbar" class="catbar" aria-label="カテゴリーフィルター"></nav>

  <!-- Targeting Crosshair -->
  <div id="targetCross" class="targetcross" hidden aria-hidden="true">
    <div class="targetcross__ring"></div>
    <div class="targetcross__dot"></div>
    <div class="targetcross__hint">この地点でOK？ 下の決定ボタンを押してね</div>
  </div>

  <!-- FAB -->
  <button id="fab" class="fab" title="ピンを刺す" aria-label="ピンを刺す">
    <svg class="fab__add" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
    <svg class="fab__check" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"></polyline></svg>
  </button>

  <!-- Trend Panel -->
  <aside id="trendPanel" class="side-panel side-panel--left" aria-label="トレンドピン" aria-hidden="true">
    <div class="side-panel__header">
      <span class="side-panel__title">🔥 今、話題のピン</span>
      <button class="side-panel__close" id="closeTrendBtn" aria-label="パネルを閉じる">×</button>
    </div>
    <div id="trendContent" class="side-panel__content"></div>
  </aside>

  <!-- Detail Panel -->
  <aside id="detailPanel" class="side-panel side-panel--right" aria-label="ピン詳細" aria-hidden="true">
    <div class="side-panel__header">
      <button class="side-panel__close" id="closeDetailBtn" aria-label="パネルを閉じる">×</button>
    </div>
    <div id="detailContent" class="side-panel__content">
      <div class="detail">
        <div id="detailHeader" class="detail__header"></div>
        <div id="detailText" class="detail__text"></div>
        <div id="detailLoc" class="detail__loc"></div>
        <div id="detailWhen" class="detail__when"></div>
        <div id="detailReactions" class="detail__reactions"></div>
        <div class="detail__actions">
          <button id="sharePinBtn" class="btn btn--pink">シェア</button>
          <button id="reportPinBtn" class="btn btn--mute">通報</button>
        </div>
      </div>
    </div>
  </aside>

  <!-- Toast -->
  <div id="toast" class="toast" role="alert" aria-live="polite" hidden></div>

  <!-- Modals -->
  <div id="modalOverlay" class="modal-overlay" hidden>
    <!-- About Modal -->
    <div id="aboutModal" class="modal" role="dialog" aria-labelledby="aboutTitle">
      <h2 id="aboutTitle">Pinly について</h2>
      <p>Pinly（ピンリー）は、街の"今"をピン留めしてシェアする、登録不要・匿名のリアルタイム地図SNSです。</p>
      <div class="modal__actions">
        <button class="btn btn--pink close-modal">はじめる</button>
      </div>
    </div>
  </div>

</body>
</html>
