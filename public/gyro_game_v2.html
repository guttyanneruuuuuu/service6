<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>GALAXY DRIFT: OVERDRIVE</title>
    <style>
        :root {
            --primary: #00d2ff;
            --primary-glow: rgba(0, 210, 255, 0.5);
            --secondary: #f9d423;
            --secondary-glow: rgba(249, 212, 35, 0.5);
            --danger: #ff4b2b;
            --danger-glow: rgba(255, 75, 43, 0.5);
            --shield: #00f2ff;
            --bg-dark: #00050a;
            --text-main: #e0f7ff;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            overflow: hidden;
            background: var(--bg-dark);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: var(--text-main);
            touch-action: none;
            user-select: none;
        }

        canvas {
            display: block;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at center, #00152a 0%, #00050a 100%);
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            padding: env(safe-area-inset-top, 20px) 20px env(safe-area-inset-bottom, 20px);
            display: flex;
            flex-direction: column;
        }

        .hud-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .stat-group {
            display: flex;
            flex-direction: column;
        }

        .label {
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.2em;
            color: var(--primary);
            text-transform: uppercase;
            margin-bottom: 2px;
            text-shadow: 0 0 10px var(--primary-glow);
        }

        .value {
            font-size: 28px;
            font-weight: 900;
            font-variant-numeric: tabular-nums;
            filter: drop-shadow(0 0 8px rgba(255,255,255,0.3));
        }

        #combo-container {
            text-align: right;
            transform: scale(0);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #combo-container.active {
            transform: scale(1);
        }

        #combo-value {
            color: var(--secondary);
            font-size: 36px;
            text-shadow: 0 0 15px var(--secondary-glow);
        }

        .shield-container {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            overflow: hidden;
            opacity: 0;
            transition: opacity 0.3s;
        }

        #shield-fill {
            width: 100%;
            height: 100%;
            background: var(--shield);
            box-shadow: 0 0 15px var(--shield);
            transform-origin: left;
        }

        #overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 5, 10, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            backdrop-filter: blur(12px);
            transition: opacity 0.5s;
        }

        .menu-content {
            width: 90%;
            max-width: 400px;
            text-align: center;
            padding: 40px 20px;
            border-radius: 32px;
            background: linear-gradient(145deg, rgba(255,255,255,0.05), rgba(255,255,255,0.01));
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        h1 {
            font-size: 42px;
            font-weight: 900;
            margin: 0 0 10px;
            letter-spacing: -0.02em;
            background: linear-gradient(to bottom, #fff 30%, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .description {
            font-size: 15px;
            line-height: 1.6;
            color: #88a;
            margin-bottom: 35px;
        }

        .highlight { color: var(--shield); font-weight: bold; }

        .btn-start {
            background: #fff;
            color: #000;
            border: none;
            padding: 18px 45px;
            font-size: 18px;
            font-weight: 800;
            border-radius: 100px;
            cursor: pointer;
            pointer-events: auto;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 30px rgba(255,255,255,0.2);
        }

        .btn-start:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 15px 40px rgba(255,255,255,0.3);
        }

        .btn-start:active {
            transform: translateY(0) scale(0.95);
        }

        #hint-text {
            position: absolute;
            bottom: 30px;
            width: 100%;
            text-align: center;
            font-size: 11px;
            color: rgba(255,255,255,0.2);
            letter-spacing: 0.1em;
            pointer-events: none;
        }

        /* Animations */
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.05); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }

        .pulse { animation: pulse 2s infinite ease-in-out; }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui-layer">
        <div class="hud-top">
            <div class="stat-group">
                <span class="label">Distance</span>
                <span id="score-value" class="value">0</span>
            </div>
            <div id="combo-container" class="stat-group">
                <span class="label">Combo</span>
                <span id="combo-value" class="value">x0</span>
            </div>
        </div>

        <div id="shield-ui" class="shield-container">
            <div id="shield-fill"></div>
        </div>
    </div>

    <div id="overlay">
        <div class="menu-content">
            <h1 id="menu-title">GALAXY<br>DRIFT</h1>
            <p id="menu-desc" class="description">
                深宇宙を加速せよ。<br>
                スマホを傾けて障害物を回避。<br>
                <span class="highlight">エネルギーコア</span>でコンボを繋ぎ、<br>
                <span class="highlight" style="color:var(--shield)">シールド</span>で無敵状態へ。
            </p>
            <button id="start-button" class="btn-start">MISSION START</button>
        </div>
    </div>

    <div id="hint-text">PC: MOUSE / MOBILE: TILT</div>

    <script>
        /**
         * GALAXY DRIFT: OVERDRIVE
         * A high-performance, visually stunning space survival game.
         */

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        const scoreEl = document.getElementById('score-value');
        const comboEl = document.getElementById('combo-value');
        const comboCont = document.getElementById('combo-container');
        const shieldUI = document.getElementById('shield-ui');
        const shieldFill = document.getElementById('shield-fill');
        const overlay = document.getElementById('overlay');
        const startBtn = document.getElementById('start-button');
        const menuTitle = document.getElementById('menu-title');
        const menuDesc = document.getElementById('menu-desc');

        // Constants
        const PLAYER_RADIUS = 20;
        const SPAWN_RATE_BASE = 40;
        const SHIELD_DURATION = 4000;
        const COMBO_TIMEOUT = 2500;

        // Game State
        let state = 'MENU';
        let score = 0;
        let combo = 0;
        let comboTimer = 0;
        let shieldTimer = 0;
        let lastTime = 0;
        let frameCount = 0;
        let speedMultiplier = 1;
        
        // Input State
        let inputX = 0;
        let inputY = 0;
        let targetInputX = 0;
        let targetInputY = 0;
        let isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

        // Objects
        const player = {
            x: 0, y: 0,
            vx: 0, vy: 0,
            rotation: 0,
            trail: [],
            pulse: 0
        };

        let obstacles = [];
        let items = [];
        let particles = [];
        let stars = [];
        let backgroundElements = [];

        // Initialization
        function init() {
            window.addEventListener('resize', onResize);
            onResize();
            createStars();
            
            if (isMobile) {
                window.addEventListener('deviceorientation', handleOrientation);
            } else {
                window.addEventListener('mousemove', handleMouseMove);
            }

            startBtn.addEventListener('click', handleStart);
            requestAnimationFrame(gameLoop);
        }

        function onResize() {
            canvas.width = window.innerWidth * window.devicePixelRatio;
            canvas.height = window.innerHeight * window.devicePixelRatio;
            ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
            player.x = window.innerWidth / 2;
            player.y = window.innerHeight * 0.8;
        }

        function createStars() {
            stars = [];
            for (let i = 0; i < 200; i++) {
                stars.push({
                    x: Math.random() * window.innerWidth,
                    y: Math.random() * window.innerHeight,
                    size: Math.random() * 1.5 + 0.5,
                    speed: Math.random() * 3 + 1,
                    brightness: Math.random()
                });
            }
        }

        function handleMouseMove(e) {
            targetInputX = (e.clientX / window.innerWidth - 0.5) * 2.5;
            targetInputY = (e.clientY / window.innerHeight - 0.75) * 2.5;
        }

        function handleOrientation(e) {
            // Gamma: left/right tilt (-90 to 90)
            // Beta: front/back tilt (-180 to 180)
            targetInputX = Math.max(-1, Math.min(1, e.gamma / 25)) * 1.5;
            let b = Math.max(10, Math.min(70, e.beta));
            targetInputY = ((b - 40) / 20) * 1.5;
        }

        async function handleStart() {
            if (isMobile && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const permission = await DeviceOrientationEvent.requestPermission();
                    if (permission !== 'granted') {
                        alert('ジャイロ操作の許可が必要です。');
                        return;
                    }
                } catch (err) {
                    console.error(err);
                }
            }
            resetGame();
        }

        function resetGame() {
            state = 'PLAYING';
            score = 0;
            combo = 0;
            comboTimer = 0;
            shieldTimer = 0;
            speedMultiplier = 1;
            obstacles = [];
            items = [];
            particles = [];
            player.trail = [];
            player.x = window.innerWidth / 2;
            player.y = window.innerHeight * 0.8;
            overlay.style.opacity = '0';
            setTimeout(() => overlay.style.display = 'none', 500);
            shieldUI.style.opacity = '0';
            comboCont.classList.remove('active');
        }

        function gameOver() {
            state = 'GAMEOVER';
            overlay.style.display = 'flex';
            setTimeout(() => overlay.style.opacity = '1', 10);
            menuTitle.textContent = 'MISSION FAILED';
            menuTitle.style.background = 'linear-gradient(to bottom, #fff, var(--danger))';
            menuTitle.style.webkitBackgroundClip = 'text';
            menuDesc.innerHTML = `
                <div style="font-size: 24px; color: #fff; margin-bottom: 10px;">SCORE: ${Math.floor(score)}</div>
                <div style="font-size: 16px; color: var(--secondary);">MAX COMBO: ${combo}</div>
                <br>宇宙の塵となりました。
            `;
            startBtn.textContent = 'RETRY MISSION';
            
            // Screen shake
            canvas.style.animation = 'none';
            void canvas.offsetWidth;
            canvas.style.animation = 'shake 0.5s cubic-bezier(.36,.07,.19,.97) both';
        }

        // Game Logic
        function spawnEntities() {
            frameCount++;
            speedMultiplier = 1 + (score / 5000);
            
            // Spawn Obstacles
            const spawnInterval = Math.max(10, Math.floor(SPAWN_RATE_BASE / speedMultiplier));
            if (frameCount % spawnInterval === 0) {
                const size = Math.random() * 30 + 20;
                obstacles.push({
                    x: Math.random() * window.innerWidth,
                    y: -size * 2,
                    size: size,
                    speed: (Math.random() * 4 + 5) * speedMultiplier,
                    rotation: Math.random() * Math.PI * 2,
                    rotSpeed: (Math.random() - 0.5) * 0.1,
                    hue: Math.random() * 20 - 10 // Slight color variation
                });
            }

            // Spawn Energy Cores
            if (frameCount % 60 === 0) {
                items.push({
                    type: 'energy',
                    x: Math.random() * (window.innerWidth - 60) + 30,
                    y: -50,
                    size: 12,
                    speed: 5 * speedMultiplier,
                    pulse: 0
                });
            }

            // Spawn Shield Cores
            if (frameCount % 600 === 0) {
                items.push({
                    type: 'shield',
                    x: Math.random() * (window.innerWidth - 60) + 30,
                    y: -50,
                    size: 18,
                    speed: 4 * speedMultiplier,
                    pulse: 0
                });
            }
        }

        function update(dt) {
            // Background stars
            stars.forEach(s => {
                s.y += s.speed * (state === 'PLAYING' ? speedMultiplier : 0.2);
                if (s.y > window.innerHeight) {
                    s.y = -10;
                    s.x = Math.random() * window.innerWidth;
                }
            });

            if (state !== 'PLAYING') return;

            spawnEntities();
            score += 0.5 * speedMultiplier;
            scoreEl.textContent = Math.floor(score);

            // Input smoothing
            inputX += (targetInputX - inputX) * 0.1;
            inputY += (targetInputY - inputY) * 0.1;

            // Player movement
            const moveX = inputX * 15;
            const moveY = inputY * 15;
            player.x += moveX;
            player.y += moveY;

            // Bounds check
            player.x = Math.max(PLAYER_RADIUS, Math.min(window.innerWidth - PLAYER_RADIUS, player.x));
            player.y = Math.max(PLAYER_RADIUS, Math.min(window.innerHeight - PLAYER_RADIUS, player.y));

            // Rotation based on movement
            player.rotation = inputX * 0.4;

            // Trail
            player.trail.push({ x: player.x, y: player.y });
            if (player.trail.length > 20) player.trail.shift();

            // Shield logic
            if (shieldTimer > 0) {
                shieldTimer -= dt;
                shieldUI.style.opacity = '1';
                shieldFill.style.transform = `scaleX(${shieldTimer / SHIELD_DURATION})`;
                if (shieldTimer <= 0) {
                    shieldUI.style.opacity = '0';
                    createExplosion(player.x, player.y, 'var(--shield)', 15);
                }
            }

            // Combo logic
            if (comboTimer > 0) {
                comboTimer -= dt;
                if (comboTimer <= 0) {
                    combo = 0;
                    comboCont.classList.remove('active');
                }
            }

            // Update Obstacles
            for (let i = obstacles.length - 1; i >= 0; i--) {
                const o = obstacles[i];
                o.y += o.speed;
                o.rotation += o.rotSpeed;

                const dx = player.x - o.x;
                const dy = player.y - o.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < PLAYER_RADIUS + o.size * 0.8) {
                    if (shieldTimer > 0) {
                        createExplosion(o.x, o.y, 'var(--shield)', 12);
                        obstacles.splice(i, 1);
                        score += 200;
                        addCombo();
                    } else {
                        createExplosion(player.x, player.y, '#fff', 40);
                        gameOver();
                    }
                    continue;
                }

                if (o.y > window.innerHeight + 100) obstacles.splice(i, 1);
            }

            // Update Items
            for (let i = items.length - 1; i >= 0; i--) {
                const item = items[i];
                item.y += item.speed;
                item.pulse += 0.1;

                const dx = player.x - item.x;
                const dy = player.y - item.y;
                const dist = Math.sqrt(dx * dx + dy * dy);

                if (dist < PLAYER_RADIUS + item.size + 10) {
                    if (item.type === 'energy') {
                        addCombo();
                        score += 500 * (1 + combo * 0.1);
                        createExplosion(item.x, item.y, 'var(--secondary)', 15);
                    } else if (item.type === 'shield') {
                        shieldTimer = SHIELD_DURATION;
                        createExplosion(item.x, item.y, 'var(--shield)', 25);
                    }
                    items.splice(i, 1);
                    continue;
                }

                if (item.y > window.innerHeight + 100) items.splice(i, 1);
            }

            // Update Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= p.decay;
                p.size *= 0.96;
                if (p.life <= 0) particles.splice(i, 1);
            }
        }

        function addCombo() {
            combo++;
            comboTimer = COMBO_TIMEOUT;
            comboEl.textContent = `x${combo}`;
            comboCont.classList.add('active');
            
            // Visual feedback
            comboEl.style.transform = 'scale(1.3)';
            setTimeout(() => comboEl.style.transform = 'scale(1)', 100);
        }

        function createExplosion(x, y, color, count) {
            for (let i = 0; i < count; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 10 + 2;
                particles.push({
                    x, y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 1,
                    decay: Math.random() * 0.03 + 0.01,
                    size: Math.random() * 4 + 2,
                    color: color
                });
            }
        }

        // Rendering
        function draw() {
            // Background
            ctx.fillStyle = '#00050a';
            ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

            // Stars
            stars.forEach(s => {
                ctx.fillStyle = `rgba(255, 255, 255, ${s.brightness})`;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctx.fill();
            });

            // Player Trail
            if (player.trail.length > 1) {
                ctx.beginPath();
                const gradient = ctx.createLinearGradient(
                    player.trail[0].x, player.trail[0].y,
                    player.x, player.y
                );
                gradient.addColorStop(0, 'transparent');
                gradient.addColorStop(1, shieldTimer > 0 ? 'rgba(0, 242, 255, 0.4)' : 'rgba(0, 210, 255, 0.4)');
                
                ctx.strokeStyle = gradient;
                ctx.lineWidth = PLAYER_RADIUS * 1.5;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.moveTo(player.trail[0].x, player.trail[0].y);
                for (let i = 1; i < player.trail.length; i++) {
                    ctx.lineTo(player.trail[i].x, player.trail[i].y);
                }
                ctx.stroke();
            }

            // Items
            items.forEach(item => {
                ctx.save();
                ctx.translate(item.x, item.y);
                const glowSize = item.size * (1.5 + Math.sin(item.pulse) * 0.3);
                
                if (item.type === 'energy') {
                    ctx.shadowBlur = 20;
                    ctx.shadowColor = 'var(--secondary)';
                    ctx.fillStyle = 'var(--secondary)';
                    ctx.beginPath();
                    ctx.arc(0, 0, item.size, 0, Math.PI * 2);
                    ctx.fill();
                    
                    // Outer ring
                    ctx.strokeStyle = 'rgba(249, 212, 35, 0.5)';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(0, 0, glowSize, 0, Math.PI * 2);
                    ctx.stroke();
                } else {
                    ctx.shadowBlur = 25;
                    ctx.shadowColor = 'var(--shield)';
                    ctx.fillStyle = 'var(--shield)';
                    ctx.beginPath();
                    ctx.arc(0, 0, item.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = '#fff';
                    ctx.lineWidth = 3;
                    ctx.stroke();
                }
                ctx.restore();
            });

            // Obstacles
            obstacles.forEach(o => {
                ctx.save();
                ctx.translate(o.x, o.y);
                ctx.rotate(o.rotation);
                
                // Dark rock body
                ctx.fillStyle = '#1a1a1a';
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 2;
                
                ctx.beginPath();
                const sides = 7;
                for (let i = 0; i < sides; i++) {
                    const angle = (i / sides) * Math.PI * 2;
                    const r = o.size * (0.8 + Math.sin(i * 1.5) * 0.2);
                    ctx.lineTo(Math.cos(angle) * r, Math.sin(angle) * r);
                }
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // Glowing cracks
                ctx.strokeStyle = `hsla(${200 + o.hue}, 70%, 50%, 0.3)`;
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(-o.size * 0.5, 0);
                ctx.lineTo(o.size * 0.5, 0);
                ctx.stroke();
                
                ctx.restore();
            });

            // Particles
            particles.forEach(p => {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;

            // Player
            if (state !== 'GAMEOVER') {
                ctx.save();
                ctx.translate(player.x, player.y);
                ctx.rotate(player.rotation);

                // Shield Aura
                if (shieldTimer > 0) {
                    ctx.beginPath();
                    ctx.arc(0, 0, PLAYER_RADIUS * 1.8, 0, Math.PI * 2);
                    const shieldGlow = ctx.createRadialGradient(0, 0, PLAYER_RADIUS, 0, 0, PLAYER_RADIUS * 2);
                    shieldGlow.addColorStop(0, 'rgba(0, 242, 255, 0)');
                    shieldGlow.addColorStop(0.8, 'rgba(0, 242, 255, 0.3)');
                    shieldGlow.addColorStop(1, 'rgba(0, 242, 255, 0)');
                    ctx.fillStyle = shieldGlow;
                    ctx.fill();
                    
                    ctx.strokeStyle = 'rgba(0, 242, 255, 0.8)';
                    ctx.lineWidth = 2;
                    ctx.setLineDash([5, 5]);
                    ctx.stroke();
                }

                // Ship Body
                ctx.shadowBlur = 20;
                ctx.shadowColor = shieldTimer > 0 ? 'var(--shield)' : 'var(--primary)';
                
                // Main hull
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.moveTo(0, -PLAYER_RADIUS * 1.5);
                ctx.lineTo(PLAYER_RADIUS, PLAYER_RADIUS);
                ctx.lineTo(0, PLAYER_RADIUS * 0.5);
                ctx.lineTo(-PLAYER_RADIUS, PLAYER_RADIUS);
                ctx.closePath();
                ctx.fill();

                // Cockpit
                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.arc(0, -PLAYER_RADIUS * 0.2, PLAYER_RADIUS * 0.3, 0, Math.PI * 2);
                ctx.fill();

                // Engine glow
                const engineGlow = Math.sin(Date.now() * 0.02) * 5 + 10;
                ctx.shadowBlur = engineGlow;
                ctx.fillStyle = varColor('--primary');
                ctx.beginPath();
                ctx.moveTo(-PLAYER_RADIUS * 0.5, PLAYER_RADIUS);
                ctx.lineTo(PLAYER_RADIUS * 0.5, PLAYER_RADIUS);
                ctx.lineTo(0, PLAYER_RADIUS + engineGlow);
                ctx.closePath();
                ctx.fill();

                ctx.restore();
            }
        }

        function varColor(name) {
            return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
        }

        function gameLoop(t) {
            const dt = t - lastTime;
            lastTime = t;
            
            update(dt);
            draw();
            
            requestAnimationFrame(gameLoop);
        }

        // Start
        init();

        // CSS Shake Animation
        const style = document.createElement('style');
        style.textContent = `
            @keyframes shake {
                10%, 90% { transform: translate3d(-1px, 0, 0); }
                20%, 80% { transform: translate3d(2px, 0, 0); }
                30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
                40%, 60% { transform: translate3d(4px, 0, 0); }
            }
        `;
        document.head.appendChild(style);

    </script>
</body>
