<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff5fa"/>
      <stop offset="1" stop-color="#ffe7f3"/>
    </linearGradient>
    <linearGradient id="pin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8fb1"/>
      <stop offset="1" stop-color="#ff2e6d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14"/>
      <feOffset dx="0" dy="14" result="o"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- decorative dots -->
  <g fill="#ff6b9d" opacity="0.12">
    <circle cx="120" cy="120" r="42"/>
    <circle cx="980" cy="510" r="60"/>
    <circle cx="1080" cy="180" r="28"/>
    <circle cx="220" cy="500" r="22"/>
  </g>
  <!-- big pin -->
  <g filter="url(#shadow)" transform="translate(150,140)">
    <path fill="url(#pin)" d="M120 0C53.7 0 0 53.7 0 120c0 88 120 184 120 184s120-96 120-184C240 53.7 186.3 0 120 0z"/>
    <circle cx="120" cy="115" r="44" fill="#fff"/>
    <circle cx="120" cy="115" r="20" fill="#ff2e6d"/>
  </g>
  <!-- text -->
  <g font-family="'Noto Sans JP','Hiragino Sans','Inter',sans-serif" fill="#4a2c40">
    <text x="470" y="240" font-size="120" font-weight="900" fill="#ff2e6d" letter-spacing="-4">Pinly</text>
    <text x="470" y="320" font-size="42" font-weight="800">街の "今" が刺さる地図</text>
    <text x="470" y="380" font-size="24" font-weight="600" fill="#7d5a71">登録不要 ・ 匿名 ・ 50字 ・ リアルタイム</text>
    <g transform="translate(470,440)">
      <rect x="0" y="0" rx="40" ry="40" width="220" height="62" fill="#ff2e6d"/>
      <text x="110" y="42" font-size="24" font-weight="900" fill="#fff" text-anchor="middle">いますぐ刺す →</text>
    </g>
    <text x="470" y="552" font-size="20" font-weight="700" fill="#7d5a71">guttyanneruuuuuu.github.io/service6</text>
  </g>
</svg>
